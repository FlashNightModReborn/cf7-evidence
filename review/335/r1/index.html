<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self' https://cf7-art-review-receipts.crazyfs.chatgpt.site; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>教官全动作校对 · #335</title>
<link rel="stylesheet" href="../../app/v1/review.css">
<link rel="preload" as="image" type="image/webp" media="(orientation: portrait)" href="./media/overview-tall.webp">
<link rel="preload" as="image" type="image/webp" media="(orientation: landscape)" href="./media/overview-wide.webp">
</head>
<body data-issue="335" data-round="r1" data-root="../" data-api="https://cf7-art-review-receipts.crazyfs.chatgpt.site">
<main class="workspace">
  <h1 class="sr">教官全动作校对，每格左原稿、右游戏</h1>
  <section id="surface" aria-label="动作同屏对照">
    <div id="board">
      <picture><source media="(orientation:portrait)" srcset="./media/overview-tall.webp"><img id="poster" src="./media/overview-wide.webp" alt="全部动作原稿与成品对照图"></picture>
      <video id="wall" playsinline muted loop preload="none" aria-hidden="true"></video>
      <div id="targets" aria-label="点一格放大并查看反馈"></div>
    </div>
  </section>
  <footer><span class="batch"><a href="https://github.com/FlashNightModReborn/CrazyFlashNight/issues/335" target="_blank" rel="noopener">#335</a> · <b id="roundLabel">R1</b></span>
    <span id="summary" role="status">正在读取校对记录</span>
    <div class="controls"><button id="play" type="button">播放全部</button><button id="slow" type="button" aria-pressed="false">半速</button></div>
  </footer>
</main>
<dialog id="detail" aria-labelledby="detailTitle">
  <div class="detail-head"><h2 id="detailTitle"></h2><button class="plain" id="back" type="button">返回总览</button></div>
  <div id="playerBox"><div id="absent" hidden>原稿待配</div><video id="single" playsinline controls preload="none"></video></div>
  <p id="question"></p>
  <details id="noteBox" hidden><summary>补一句（选填）</summary><label for="note">随反馈展示</label><textarea id="note" maxlength="180" rows="2"></textarea></details>
  <div id="answers" class="answers"></div>
  <p id="result" role="status"></p>
  <img id="still" hidden alt="开始、中段和结束的三格静帧">
  <section id="historyBox" hidden aria-label="反馈历史"><h3>这招的记录</h3><ol id="history"></ol></section>
</dialog>
<script type="module" src="../../app/v1/review.js"></script>
</body>
</html>
