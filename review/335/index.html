<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'self' https://cf7-art-review-receipts.crazyfs.chatgpt.site; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>特种兵与教官全动作校对（R2 · Alter） · #335</title>
<link rel="stylesheet" href="../app/v4/review.css">
<link rel="preload" as="image" type="image/webp" media="(orientation: portrait)" href="r2/media/overview-tall.webp">
<link rel="preload" as="image" type="image/webp" media="(orientation: landscape)" href="r2/media/overview-wide.webp">
</head>
<body data-issue="335" data-round="latest" data-root="./" data-api="https://cf7-art-review-receipts.crazyfs.chatgpt.site">
<main class="workspace">
  <h1 class="sr">特种兵与教官全动作校对（R2 · Alter），每格左原稿、右游戏</h1>
  <section id="surface" aria-label="动作同屏对照">
    <div id="board">
      <picture><source media="(orientation:portrait)" srcset="r2/media/overview-tall.webp"><img id="poster" src="r2/media/overview-wide.webp" alt="全部动作原稿与成品对照图"></picture>
      <video id="wall" playsinline muted loop preload="none" aria-hidden="true"></video>
      <div id="targets" aria-label="点一格放大并查看反馈"></div>
    </div>
  </section>
  <footer><span class="batch"><a href="https://github.com/FlashNightModReborn/CrazyFlashNight/issues/335" target="_blank" rel="noopener">#335</a> · <b id="roundLabel">R2</b></span>
    <span id="summary" role="status">正在读取校对记录</span>
    <div class="controls"><button id="chooseComment" class="primary" type="button" aria-pressed="false">写评论</button><button id="githubUser" type="button">GitHub 登录</button><button id="play" type="button">播放全部</button><button id="slow" type="button" aria-pressed="false">半速</button></div>
  </footer>
</main>
<dialog id="detail" aria-labelledby="detailTitle">
  <div class="detail-head"><h2 id="detailTitle"></h2><button class="plain" id="back" type="button">返回总览</button></div>
  <div id="playerBox"><div id="absent" hidden>原稿待配</div><video id="single" playsinline controls preload="auto"></video></div>
  <section class="composer" aria-labelledby="noteLabel">
    <div class="composer-head"><label id="noteLabel" for="note">写评论</label><span id="noteTime"></span></div>
    <textarea id="note" maxlength="180" rows="2" placeholder="写下你看到的问题，例如「右手抬得太早」。"></textarea>
    <div class="compose-actions"><button id="sendNote" class="primary" type="button">用 GitHub 账号发表</button><span id="commentHint">首次发表时，在 GitHub 确认账号。</span></div>
    <p id="result" role="status"></p>
  </section>
  <p id="question"></p>
  <div id="answers" class="answers"></div>
  <img id="still" hidden alt="开始、中段和结束的三格静帧">
  <section id="historyBox" hidden aria-label="反馈历史"><h3>这招的记录</h3><ol id="history"></ol></section>
</dialog>
<script type="module" src="../app/v4/review.js"></script>
</body>
</html>
